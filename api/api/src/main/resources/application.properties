# ===============================
# Configuración de Base de Datos
# ===============================
spring.datasource.url=jdbc:postgresql://192.168.1.200:5433/lexflow_db
spring.datasource.username=lexflow_admin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Configuración de JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Configuración de Swagger
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===============================
# Configuración de Archivos
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.jackson.mapper.accept-case-insensitive-enums=true

# ===============================
# CREDENCIALES DE GOOGLE DRIVE
# ===============================
google.drive.client-id=${GOOGLE_DRIVE_CLIENT_ID}
google.drive.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET}
google.drive.refresh-token=${GOOGLE_DRIVE_REFRESH_TOKEN}
google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID}

# ===============================
# CONFIGURACIÓN S3 / MINIO
# ===============================
cloud.aws.s3.endpoint=${AWS_S3_ENDPOINT}
cloud.aws.s3.access-key=${AWS_S3_ACCESS_KEY}
cloud.aws.s3.secret-key=${AWS_S3_SECRET_KEY}
cloud.aws.s3.bucket-name=lexflow-archivos
cloud.aws.s3.region=us-east-1